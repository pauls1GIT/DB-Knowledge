services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kedb
      POSTGRES_PASSWORD: kedb123
      POSTGRES_DB: kedb
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kedb -d kedb"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - kedb_postgres:/var/lib/postgresql/data
volumes:
  kedb_postgres:
