[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "known-error-curator"
version = "0.1.0"
description = "MVP Known Error DB Curator with Clean Architecture, LangGraph, hybrid retrieval and HITL"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary,pool]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "langgraph>=0.6",
  "langgraph-checkpoint-postgres>=2.0",
  "chromadb>=1.0",
  "httpx>=0.27",
  "streamlit>=1.40",
  "python-multipart>=0.0.12",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "faker>=30.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
