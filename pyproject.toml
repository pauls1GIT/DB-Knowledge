[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "known-error-curator-databricks"
version = "0.1.0"
description = "Databricks-native Known Error Database Curator MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary,pool]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "langgraph>=0.2.57",
  "graphviz>=0.20",
  "httpx>=0.27",
  "aiohttp>=3.14.3,<4",
  "requests>=2.32",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "streamlit>=1.64",
  "openai>=1.40",
  "databricks-sdk>=0.89.0",
  "databricks-ai-search>=0.65",
  "databricks-langchain>=0.21,<0.22",
  # Unity Catalog's transitive dependency currently caps typing-extensions at 4.15.
  "typing-extensions>=4.15,<4.16",
]

[project.optional-dependencies]
observability = ["ai-observability-sdk==0.3.0"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kedb.presentation.streamlit" = ["assets/*.mp3"]
